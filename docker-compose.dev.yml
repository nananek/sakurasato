# 開発用 overlay。`docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build` で使う。
# 本番との差分:
#   - internal ネットの isolation を解除し、postgres / versitygw を 127.0.0.1
#     にポート公開してホストから sqlx 等で触れるようにする。
#     本番では internal: true のまま使うこと (CLAUDE.md §6, §7)。
#   - server を外部公開 (8080) してリバースプロキシなしでも触れるように。
#   - tracing ログを debug に。

networks:
  internal:
    # 本番では internal: true で外部不可達。dev では host からの直接接続を許可。
    internal: false

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  versitygw:
    ports:
      - "127.0.0.1:7070:7070"

  server:
    environment:
      RUST_LOG: "sakurasato=debug,info"
    ports:
      - "127.0.0.1:8080:8080"

  media-proxy:
    environment:
      RUST_LOG: "sakurasato=debug,info"
