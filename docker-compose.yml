# Sakurasato 本番想定 compose。
# 方針 (CLAUDE.md §3 / §6 / §7):
#   - server は外部公開 (リバースプロキシ経由 443 を想定) + AP 配送と
#     remote actor fetch の egress を持つ (暫定、Issue #23)。M6 で再評価。
#   - 外部 GET (画像 / OGP) の egress は media-proxy のみ。
#   - postgres と versitygw は内部ネットからのみ到達可。
#   - 全コンテナ非 root・read-only fs・cap_drop ALL・no-new-privileges。
#   - シークレットは compose secrets で注入。

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    <<: *hardening
    # cap_drop: [ALL] のため root による chown ができないので、
    # 最初から postgres ユーザ (alpine では uid/gid 70) で起動する。
    user: "70:70"
    # postgres は内部書き込みパスがあるので tmpfs を割り当てる。
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_DB: sakurasato
      POSTGRES_USER: sakurasato
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      # docker compose (非 swarm) は bind-mount された secret の uid/gid/mode を
      # 変更できない (compose の警告で明示される) ため、ホスト側ファイルの
      # パーミッションがそのまま反映される。dev では 0644 で運用し、
      # 本格的な secret 管理は M10 (セキュリティ硬化) で対応する。
      - postgres_password
    volumes:
      # postgres 18+ の推奨は /var/lib/postgresql 単一マウント
      # (pg_upgrade --link を可能にするため)。
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakurasato -d sakurasato"]
      interval: 10s
      timeout: 5s
      retries: 5

  versitygw:
    build:
      context: .
      dockerfile: docker/versitygw.Dockerfile
    image: sakurasato/versitygw:dev
    <<: *hardening
    # 上書き不要 (Dockerfile で USER 65534)。
    tmpfs:
      - /tmp
    # versitygw は --secret-file を持たないので、secret ファイルを env に注入してから exec する。
    entrypoint:
      - /bin/sh
      - -c
      - 'export ROOT_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)" && exec versitygw --port=:7070 --access=sakurasato posix /data'
    secrets:
      - s3_secret_key
    volumes:
      - versitygw_data:/data
    networks:
      - internal

  media-proxy:
    build:
      context: .
      dockerfile: docker/media-proxy.Dockerfile
    image: sakurasato/media-proxy:dev
    <<: *hardening
    tmpfs:
      - /tmp
    # 危険な入力のデコードが暴走しても OOM kill で本体に波及させない。
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    volumes:
      - media_sock:/run/sakurasato
    networks:
      # media-proxy のみ外部 egress を持つ (internal: false)
      - internal
      - egress

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: sakurasato/server:dev
    <<: *hardening
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      versitygw:
        condition: service_started
      media-proxy:
        condition: service_started
    environment:
      SAKURASATO_DATABASE__URL: "postgres://sakurasato:{password}@postgres:5432/sakurasato"
      SAKURASATO_DATABASE__PASSWORD_FILE: "/run/secrets/postgres_password"
      SAKURASATO_STORAGE__ENDPOINT: "http://versitygw:7070"
      # versitygw と同じ secret を読ませることで S3 認証を整合させる。
      SAKURASATO_STORAGE__SECRET_ACCESS_KEY_FILE: "/run/secrets/s3_secret_key"
      SAKURASATO_MEDIA_PROXY__SOCKET: "/run/sakurasato/media.sock"
      SAKURASATO_SERVER__LOCAL_API_SOCKET: "/run/sakurasato-local/local.sock"
    secrets:
      - postgres_password
      - s3_secret_key
    volumes:
      # media-proxy と共有する Unix socket (内部通信専用)。
      - media_sock:/run/sakurasato
      # TUI 用ローカル API ソケット領域。M1 時点では named volume を使い
      # docker が所有権を管理する (host bind だと distroless nonroot=65532 が
      # 書き込めない)。M5 で TUI を実装する際は本ボリュームを host から触れる
      # 形に切り替える (例: bind mount + 事前 chown、または UDS forwarder)。
      - local_sock:/run/sakurasato-local
    networks:
      # 暫定 (Issue #23 / CLAUDE.md §3): ActivityPub 配送と remote actor fetch は
      # server から直接外部 (HTTPS POST / GET) に出る設計。Mastodon / Misskey /
      # Pleroma も server 直配送が業界標準で、配送経路を media-proxy に通す利点が
      # 限定的なため。受け取るレスポンスは JSON のみで画像デコードを伴わない。
      # M6 (media-proxy 実装) 時に再評価する。
      - internal
      - egress

networks:
  internal:
    internal: true
  egress:
    # 外向き bridge ネット。`media-proxy` (外部 GET / 画像取得) と `server`
    # (AP 配送 POST / remote actor fetch、暫定 #23) が参加する。
    # CLAUDE.md §3 / §6 / §7 の方針と整合。M6 で `server` の参加可否を再評価する。
    driver: bridge

volumes:
  postgres_data:
  versitygw_data:
  media_sock:
  local_sock:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  s3_secret_key:
    file: ./secrets/s3_secret_key.txt
