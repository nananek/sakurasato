# Sakurasato 既定設定。
# 環境変数 SAKURASATO_<SECTION>__<KEY> で個別に上書きできる。
# 例: SAKURASATO_SERVER__HOST=example.com

[server]
host = "localhost"
# 既定 listener (= `public_listen` / `local_api_listen` 未設定時の fallback)。
# 公開 AP = TCP 8080、ローカル API = UDS の伝統的構成。
bind = "0.0.0.0:8080"
local_api_socket = "/run/sakurasato/local.sock"
user = "me"

# ── #69: Listener transport の URI 表現 (任意設定) ───────────────────────
#
# 公開 AP / ローカル API それぞれ `tcp://host:port` または `unix:/path` を
# 個別に指定できる。未設定なら上の `bind` / `local_api_socket` に倒れる。
#
# 推奨運用:
# - Cloudflared Tunnel → 公開 AP は UDS。host にポートを出さない。
#     public_listen = "unix:/run/sakurasato/public.sock"
# - Tailscale tailnet 越しの TUI → ローカル API は TCP。
#     local_api_listen = "tcp://0.0.0.0:18080"
#
# どちらか片方だけ切り替えるのも OK (= 既定値と混在可能)。
#
# public_listen = "unix:/run/sakurasato/public.sock"
# local_api_listen = "tcp://0.0.0.0:18080"

[database]
# `{password}` プレースホルダは起動時に `password_file` の中身で置換される。
# password_file 未設定で `{password}` が残っていると Config::load 後の
# resolved_url() がエラーを返す。
url = "postgres://sakurasato:{password}@postgres:5432/sakurasato"
# password_file = "/run/secrets/postgres_password"

[storage]
# versitygw は非公開。compose 内部ネットからのみ到達する。
endpoint = "http://versitygw:7070"
bucket = "sakurasato"
region = "us-east-1"
access_key_id = "sakurasato"
# CHANGE-ME: secret_access_key はプレースホルダ。本番は必ず
# secret_access_key_file (= /run/secrets/...) か KMS 経由で差し替え、
# この値を読まれない構成にすること。
secret_access_key = "sakurasato-change-me"
# secret_access_key_file = "/run/secrets/s3_secret_key"

[media_proxy]
socket = "/run/sakurasato/media.sock"
max_bytes = 26214400      # 25 MiB
max_pixels = 33554432     # 8192 * 4096 相当
