# Sakurasato 既定設定。
# 環境変数 SAKURASATO_<SECTION>__<KEY> で個別に上書きできる。
# 例: SAKURASATO_SERVER__HOST=example.com

[server]
host = "localhost"
# 既定 listener (= `public_listen` / `local_api_listen` 未設定時の fallback)。
# 公開 AP = TCP 8080、ローカル API = UDS の伝統的構成。
bind = "0.0.0.0:8080"
local_api_socket = "/run/sakurasato/local.sock"
user = "me"
# 1 投稿あたりの最大文字数。MiAuth 互換 `/api/meta.maxNoteTextLength` に反映
# され、Misskey クライアントの compose UI 上限と連動する。既定 3000 (Misskey 公式値)。
max_note_text_length = 3000

# ── サーバ情報 (任意 / NodeInfo metadata 経由で他鯖に公開) ───────────────
# `[server.info]` を空にしておくと NodeInfo metadata は `{}` で従来挙動。
# 入れた項目だけ emit される (=空文字 / 未設定キーは出さない)。
# overlay TOML / env (`SAKURASATO_SERVER__INFO__DESCRIPTION` 等) でも上書き可。
#
# [server.info]
# name = "My Quiet Sakurasato"
# description = "neko の隠れ家。Mastodon / Misskey 連合。"
# admin_name = "neko"
# admin_contact = "mailto:neko@example.com"
# theme_color = "#ffb7c5"
# banner_url = "https://example.com/banner.webp"
# terms_url = "https://example.com/terms"
# repository_url = "https://github.com/nananek/sakurasato"
[server.info]

# ── #69: Listener transport の URI 表現 (任意設定) ───────────────────────
#
# 公開 AP / ローカル API それぞれ `tcp://host:port` または `unix:/path` を
# 個別に指定できる。未設定なら上の `bind` / `local_api_socket` に倒れる。
#
# 推奨運用:
# - Cloudflared Tunnel → 公開 AP は UDS。host にポートを出さない。
#     public_listen = "unix:/run/sakurasato/public.sock"
# - Tailscale tailnet 越しの TUI → ローカル API は TCP。
#     local_api_listen = "tcp://0.0.0.0:18080"
#
# どちらか片方だけ切り替えるのも OK (= 既定値と混在可能)。
#
# public_listen = "unix:/run/sakurasato/public.sock"
# local_api_listen = "tcp://0.0.0.0:18080"

[database]
# `{password}` プレースホルダは起動時に `password_file` の中身で置換される。
# password_file 未設定で `{password}` が残っていると Config::load 後の
# resolved_url() がエラーを返す。
url = "postgres://sakurasato:{password}@postgres:5432/sakurasato"
# password_file = "/run/secrets/postgres_password"

[storage]
# versitygw は非公開。compose 内部ネットからのみ到達する。
endpoint = "http://versitygw:7070"
bucket = "sakurasato"
region = "us-east-1"
access_key_id = "sakurasato"
# CHANGE-ME: secret_access_key はプレースホルダ。本番は必ず
# secret_access_key_file (= /run/secrets/...) か KMS 経由で差し替え、
# この値を読まれない構成にすること。
secret_access_key = "sakurasato-change-me"
# secret_access_key_file = "/run/secrets/s3_secret_key"

[media_proxy]
socket = "/run/sakurasato/media.sock"
max_bytes = 26214400      # 25 MiB
max_pixels = 33554432     # 8192 * 4096 相当

# 動画添付 (video/mp4, video/webm)。再エンコードしない (コンテナメタデータの
# 無害化のみ) ため出力サイズ ≒ 入力サイズ。画像用 max_bytes とは別枠で
# 一桁大きい値を許容する。
[media_proxy.video]
max_bytes = 209715200      # 200 MiB
max_duration_secs = 300    # 5 分

# TUI からの Misskey 形式絵文字 zip インポート (`POST /api/v1/emojis/import`)。
# zip ファイル全体のサイズ上限。zip 内 1 emoji あたりの上限や件数上限は
# サーバ側に別途ハードコードされている (emoji_import モジュール参照)。
[media_proxy.emoji_import]
max_zip_bytes = 104857600  # 100 MiB

# ── #150 / M14 #157: MiAuth 互換 API endpoint (オプション) ───────────────
#
# Misskey クライアント (= Milktea / MissRirica など) からリアクション / 投稿
# などを叩けるようにする「第二 UDS」。**コメントアウト** されている間は
# socket が作られず、Misskey 互換 endpoint は一切公開されない (= 既存 TUI 用
# `local_api` 経路には影響しない)。
#
# 有効化する場合は推奨設定:
#   - UDS のみ (= `cloudflared` 等で公開しない)
#   - Tailscale tailnet 越しに mobile デバイスから叩く場合は `unix:` のままで、
#     ホスト側に `socat` 等の薄いブリッジを置く (= `DEPLOYMENT.md` 参照)
#
# `cloudflared` で公開してはいけない理由 ── Web UI なし運用ゆえ「Misskey
# 互換クライアントが想定外の endpoint を叩いてくる」+「ハイジャックされた
# token で投稿まで通る」リスク。Sakurasato は MiAuth トークンに permission
# scope (read:account / write:notes / write:reactions / ...) を強制するが、
# 多層防御として socket 自体の公開も避けるべき。
#
# [miauth]
# listen = "unix:/run/sakurasato/miauth.sock"
# # pending session の有効期限 (秒)。Misskey 公式クライアントが UUID 生成 →
# # 認可 URL 表示 → CLI で approve → polling 開始までの現実的所要時間で 10 分。
# session_ttl_secs = 600
