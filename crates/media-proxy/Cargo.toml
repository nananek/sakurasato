[package]
name = "sakurasato-media-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sakurasato-media-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sakurasato-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
http.workspace = true
bytes.workspace = true
# `stream` feature でストリーミング受信 (= 累計サイズ上限チェック) を有効化。
reqwest = { workspace = true, features = ["stream"] }
# 外部 URL のデコード + リサイズ + WebP 再エンコード。CLAUDE.md §7 に従い
# **このバイナリでのみ** 使う。server / TUI 本体には引き込まない。
# WebP encode 用に `webp` を明示 enable (default-features=false にすると
# encoder が落ちるので features 列に明示)。
image = { workspace = true, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
