[package]
name = "sakurasato-media-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sakurasato-media-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sakurasato-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
http.workspace = true
bytes.workspace = true
# `stream` feature でストリーミング受信 (= 累計サイズ上限チェック) を有効化。
reqwest = { workspace = true, features = ["stream"] }
# 外部 URL のデコード + リサイズ + WebP 再エンコード。CLAUDE.md §7 に従い
# **このバイナリでのみ** 使う。server / TUI 本体には引き込まない。
# WebP encode 用に `webp` を明示 enable (default-features=false にすると
# encoder が落ちるので features 列に明示)。
image = { workspace = true, features = ["png", "jpeg", "webp", "gif"] }
# animated GIF / APNG / animated WebP の再エンコードに使う (#129)。
# `image` crate の WebP encoder は still 限定なので libwebp 経由の
# `AnimEncoder` でフレームを保持したまま animated WebP に焼き直す。
webp = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# APNG (animated PNG) fixture を tests で組み立てるため。`image` crate には
# APNG encoder が無いので `png` crate 直叩きで 2 frame APNG を作る。
# `image` の transitive dep として既に Cargo.lock には乗っているので追加
# コストは無い。
png = "0.18"
