[package]
name = "sakurasato-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sakurasato-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sakurasato-core.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
url.workspace = true
clap.workspace = true
http.workspace = true

ratatui.workspace = true
crossterm.workspace = true

# Unix socket 越しの HTTP/SSE クライアント。
hyperlocal.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
eventsource-stream.workspace = true

# M5 PR2: 画像対応
ratatui-image.workspace = true
image.workspace = true
lru.workspace = true
# M6 で reqwest dep を撤去 (Issue #36 解消): アバター取得は LocalApi 経由で
# server → media-proxy に委譲するため、TUI 側に外向き HTTPS クライアントは
# 持たない。UDS への HTTP/1.1 は hyperlocal で完結する。

[dev-dependencies]
tempfile = "3"
# 統合テスト用に hyper の server 機能を引く (本体は client のみ)。
hyper = { workspace = true, features = ["server"] }
