[package]
name = "sakurasato-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sakurasato-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sakurasato-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
chrono.workspace = true
rsa.workspace = true
ed25519-dalek.workspace = true
multibase.workspace = true
http.workspace = true
base64.workspace = true
httpdate.workspace = true
indexmap.workspace = true
sha2.workspace = true
subtle.workspace = true
base16ct.workspace = true
# `stream` feature: `fetch_object_json` のレスポンス本文を `bytes_stream()` で
# 読みながら上限を強制する (E-1)。media-proxy 側と同じ feature 指定。
reqwest = { workspace = true, features = ["stream"] }
url.workspace = true
aws-sdk-s3.workspace = true
aws-credential-types.workspace = true
# M6: media-proxy への UDS HTTP/1.1 クライアント。TUI が server を叩くために
# 使っているのと同じスタック (hyperlocal + hyper-util + hyper)。
# 信頼境界外の URL を直接 fetch しないため、本クライアントは「media-proxy
# 専用の UDS 通信」だけに使う。`reqwest` の `Client` は別途 AP 配送に残す。
hyperlocal.workspace = true
hyper-util.workspace = true
hyper.workspace = true
http-body-util.workspace = true
bytes.workspace = true
# M8: Misskey 形式 zip インポート CLI。raw bytes は decode せず media-proxy
# `/v1/image/sanitize` に流す ── `image` クレートは引き込まない契約 (CLAUDE.md §7)。
zip.workspace = true
# M14 #157: MiAuth session UUID parse / display。
uuid.workspace = true

[dev-dependencies]
sakurasato-core = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# integration tests need real Ed25519 keypairs (mock PEM can't be parsed by
# the actor JSON multibase converter).
ed25519-dalek = { workspace = true }
rsa = { workspace = true }
# `token::write_token_file` の単体テストで一時ディレクトリを作る用。
# tui crate でも 3 系を使っており workspace 内で共有する。
tempfile = "3"
