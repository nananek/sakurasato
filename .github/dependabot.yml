version: 2
updates:
  # Rust crates
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Dockerfile (server / media-proxy)
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
