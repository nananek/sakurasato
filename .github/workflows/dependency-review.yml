name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # MIT プロジェクト: コピーレフト系の混入を弾く
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
          # `Apache-2.0 OR GPL-2.0-only` のような OR 表記でも dep-review は
          # 「片方が GPL → 拒否」と扱うため、純 Apache-2.0 を選べる
          # デュアルライセンス crate は個別に exception を入れる。
          # self_cell: ratatui-image 経由で入る (Apache-2.0 を採用)。
          allow-dependencies-licenses: pkg:cargo/self_cell
