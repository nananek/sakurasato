name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # M2 から sqlx 統合テスト用に postgres を立ち上げる。
    # SQLX_OFFLINE=true でも `#[sqlx::test]` はランタイムで実 DB を必要とする。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sakurasato
          POSTGRES_PASSWORD: sakurasato
          POSTGRES_DB: sakurasato
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakurasato -d sakurasato"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6

      # Cargo workspace がまだ無い間 (M1 着手前) は Rust ステップをスキップして
      # required status check を緑に保つ。Cargo.toml が入った時点で本稼働する。
      - name: Detect Cargo workspace
        id: cargo
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cargo.toml が無いため Rust ステップをスキップします (M1 以降で有効化)"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cargo.outputs.present == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.cargo.outputs.present == 'true'

      - name: rustfmt
        if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: clippy
        if: steps.cargo.outputs.present == 'true'
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        if: steps.cargo.outputs.present == 'true'
        env:
          # offline 用 .sqlx キャッシュは PR と一緒にコミットされる。
          SQLX_OFFLINE: "true"
          # runtime での #[sqlx::test] が使う接続文字列。
          DATABASE_URL: "postgres://sakurasato:sakurasato@localhost:5432/sakurasato"
        run: cargo test --workspace
