name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      # 連合テスト compose / scripts / pytest 一式 / 専用 workflow は CI 対象外
      # (重いビルドかつ外部 image に依存)。federation-test*.yml が nightly cron
      # + main PR で別建てに回す ([[federation-test-plan]])。
      - "compose/docker-compose.federation-*.yml"
      - "compose/federation-test/**"
      - "scripts/federation-test/**"
      - "tests/federation/**"
      - ".github/workflows/federation-test.yml"
      - ".github/workflows/federation-test-nekonoverse.yml"
      - ".github/workflows/federation-test-pleroma.yml"
      - ".github/workflows/federation-test-mitra.yml"
      - ".github/workflows/federation-test-fedibird.yml"
      # release-validation は main PR 専用 (docker build + stack smoke)。
      # この workflow ファイル単独の変更で ci まで回す必要はない。
      - ".github/workflows/release-validation.yml"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "compose/docker-compose.federation-*.yml"
      - "compose/federation-test/**"
      - "scripts/federation-test/**"
      - "tests/federation/**"
      - ".github/workflows/federation-test.yml"
      - ".github/workflows/federation-test-nekonoverse.yml"
      - ".github/workflows/federation-test-pleroma.yml"
      - ".github/workflows/federation-test-mitra.yml"
      - ".github/workflows/federation-test-fedibird.yml"
      - ".github/workflows/release-validation.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # M2 から sqlx 統合テスト用に postgres を立ち上げる。
    # SQLX_OFFLINE=true でも `#[sqlx::test]` はランタイムで実 DB を必要とする。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sakurasato
          POSTGRES_PASSWORD: sakurasato
          POSTGRES_DB: sakurasato
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakurasato -d sakurasato"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      # Cargo workspace がまだ無い間 (M1 着手前) は Rust ステップをスキップして
      # required status check を緑に保つ。Cargo.toml が入った時点で本稼働する。
      - name: Detect Cargo workspace
        id: cargo
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cargo.toml が無いため Rust ステップをスキップします (M1 以降で有効化)"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cargo.outputs.present == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.cargo.outputs.present == 'true'

      - name: rustfmt
        if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: clippy
        if: steps.cargo.outputs.present == 'true'
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        if: steps.cargo.outputs.present == 'true'
        env:
          # offline 用 .sqlx キャッシュは PR と一緒にコミットされる。
          SQLX_OFFLINE: "true"
          # runtime での #[sqlx::test] が使う接続文字列。
          DATABASE_URL: "postgres://sakurasato:sakurasato@localhost:5432/sakurasato"
        run: cargo test --workspace
