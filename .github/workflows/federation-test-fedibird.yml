name: Federation Test (Fedibird)

# 連合テスト (pytest + httpx) の自動駆動。Fedibird は Mastodon フォークで
# REST API 互換性が高いため、`test_fedibird.py` は `test_mastodon.py` の
# 中核パターンを踏襲する
# (tmp/plan-federation-test-pleroma-mitra-fedibird.md §2.B)。
#
# 起動契機:
#   - nightly cron (UTC 20:45 = JST 05:45 ── mastodon (19:00) / nekonoverse
#     (19:30) / nekonoverse-2sks (19:45) / misskey (20:00) / pleroma (20:15) /
#     mitra (20:30) と 15 分刻みでずらして runner 競合を緩める)
#   - workflow_dispatch (= UI から手動キック)
#   - **main 向け PR** (= develop → main の release PR)。required check 化を
#     想定し、release 前に必ず通す。develop 向け PR では発火させない
#     (Fedibird の inline build が初回 30 分強かかり、開発体験を損なうため)。
#
# 失敗時の調査:
#   1. Actions タブの個別 run ログ
#   2. "Collect logs on failure" step の出力 (各 service の tail-300)

on:
  workflow_dispatch:
  schedule:
    - cron: "45 20 * * *"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: federation-test-fedibird
  cancel-in-progress: false

jobs:
  fedibird:
    name: Fedibird (programmatic)
    runs-on: ubuntu-latest
    # Fedibird の inline build (Ruby/Rails, buildkit cache 無しだと初回 30 分強)
    # + sakurasato 側ビルド + pytest で全体 75 分上限。他 impl より大きく
    # 取るのは fedibird-web の cold build 時間のため。
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7

      - name: docker compose version
        run: docker compose version

      # BuildKit cache を効かせる: sakurasato server / media-proxy /
      # federation-pytest image の再 build を cache hit に倒す
      # (fedibird-web 本体の inline build 自体はキャッシュ対象外)。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run pytest stack
        # DEBUG_KEEP=1: pytest.sh の `trap cleanup EXIT` (= down -v) を抑止し、
        # 失敗時にコンテナを残して下の "Collect logs on failure" を実働させる
        # (#201 と同根)。後始末は末尾の "Tear down on failure" (if: always())
        # が必ず行う。
        run: DEBUG_KEEP=1 ./scripts/federation-test/pytest.sh fedibird

      - name: Collect logs on failure
        if: failure()
        run: |
          set +e
          project="sakurasato-fed-fedibird-pytest"
          compose_file="compose/docker-compose.federation-fedibird.yml"
          for svc in sakurasato-init sakurasato-server sakurasato-media-proxy \
                     postgres-sks nginx-sks \
                     postgres-fb redis-fb fedibird-web fedibird-sidekiq nginx-fb \
                     sakurasato-token-issuer sakurasato-prefollow-bob; do
            echo "==> ${svc} logs"
            docker compose -p "$project" -f "$compose_file" \
              --profile pytest logs --no-color --tail=300 "$svc" || true
          done
          echo "==> pytest logs"
          docker compose -p "$project" -f "$compose_file" \
            --profile pytest logs --no-color --tail=500 pytest || true

      - name: Tear down on failure
        if: always()
        run: |
          project="sakurasato-fed-fedibird-pytest"
          docker compose -p "$project" \
            -f compose/docker-compose.federation-fedibird.yml \
            --profile pytest down -v --remove-orphans || true
