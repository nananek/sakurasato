name: Notify Discord on claude-review verdict

# claude[bot] が PR にコメントを残したとき、verdict (approve /
# request-changes / block) を Discord webhook に通知する。
#
# 必要な repo secret:
#   DISCORD_REVIEW_WEBHOOK_URL  ... Discord チャンネルの Webhook URL
#
# 注意:
# - issue_comment.created のみ拾う (edited は事後 typo 修正等で重複通知に
#   なるため除外)
# - claude[bot] 以外のコメント / verdict 行を含まないコメントは無視
# - jq でメッセージを組み立て、curl で Discord に POST
# - DISCORD_REVIEW_WEBHOOK_URL 未設定なら skip (fork PR 等を想定)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'claude[bot]' &&
      contains(github.event.comment.body, 'verdict')
    runs-on: ubuntu-latest
    # 二重防御: webhook が長期間応答しないケースで runner が GH の既定
    # 6 時間タイムアウトまで占有されないよう、ジョブ側で 5 分に絞る。
    # ステップ内 curl にも --max-time を入れるが、jq / その他で固まった
    # 場合の保険として。
    timeout-minutes: 5
    steps:
      - name: Parse verdict and post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.issue.title }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ github.event.issue.html_url }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_REVIEW_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          # verdict 行を抽出 (大小文字無視、markdown 太字 `**verdict:**` も対応)
          verdict_line=$(printf '%s' "$COMMENT_BODY" \
            | grep -iEm 1 '^(\*\*)?verdict[: *]+' || true)

          if [ -z "$verdict_line" ]; then
            echo "No verdict line found in comment body, skipping."
            exit 0
          fi

          # PR #32 round-1 🔴 Finding 1: `verdict:` 以降のキーワード部分だけ
          # 抽出してから種別判定する。元の `grep 'approve'` は本文に "approve"
          # が含まれる任意の verdict (例: "verdict: request-changes — 〜
          # approve 〜") を緑通知扱いしてしまうため。
          verdict_keyword=$(printf '%s' "$verdict_line" \
            | sed -E 's/^(\*\*)?verdict[: *]+//I' \
            | tr -d '*' \
            | awk '{print $1}')
          echo "Extracted verdict keyword: '$verdict_keyword'"

          # 抽出後はキーワード自体に対する完全一致 (case-insensitive) で判定。
          # `block` は本リポのレビュー指示で使われる verdict (旧 reject 相当)。
          # reject も保険として拾う。
          case "$(printf '%s' "$verdict_keyword" | tr '[:upper:]' '[:lower:]')" in
            approve)
              verdict_kind="approve"
              verdict_label="✅ approve"
              color=5763719   # green
              ;;
            request-changes|request_changes|requestchanges)
              verdict_kind="request-changes"
              verdict_label="🟠 request-changes"
              color=15105570  # orange
              ;;
            block|reject)
              verdict_kind="block"
              verdict_label="🔴 block"
              color=15548997  # red
              ;;
            *)
              verdict_kind="other"
              # 異常に長い verdict_line が description に入り Discord API の
              # 4096 文字制限に当たらないよう先頭 100 文字に切り詰め。
              verdict_label="❔ $(printf '%s' "$verdict_line" | cut -c1-100)"
              color=10070709  # grey
              ;;
          esac

          echo "Verdict: $verdict_kind"

          # PR #32 round-1 🟡 Finding 3 対応: Discord embed `title` は 256 文字
          # 上限。GitHub PR タイトルが長いと API が 400 を返して通知が静かに
          # 消えるので、念のため Discord 制限内に収めておく。
          title_raw="PR #${PR_NUMBER}: ${PR_TITLE}"
          title="${title_raw:0:256}"

          # Discord embed payload (jq でエスケープ)
          payload=$(jq -nc \
            --arg title "$title" \
            --arg url "$PR_URL" \
            --arg label "$verdict_label" \
            --arg author "$PR_AUTHOR" \
            --arg comment_url "$COMMENT_URL" \
            --argjson color "$color" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $label,
                color: $color,
                fields: [
                  {name: "PR Author", value: $author, inline: true},
                  {name: "Comment", value: "[Jump to review](\($comment_url))", inline: true}
                ],
                timestamp: now | todateiso8601
              }]
            }')

          # PR #32 round-1 🟠 Finding 2 対応: --connect-timeout / --max-time
          # を必ず指定し、Discord 側が応答しない場合に runner を 6 時間占有
          # しないようにする。ジョブ側の `timeout-minutes: 5` と二重に守る。
          # Discord に POST (失敗は echo するが workflow を fail させない)
          http_code=$(curl -sS --connect-timeout 5 --max-time 15 \
            -o /tmp/discord-response.txt -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -X POST -d "$payload" \
            "$DISCORD_WEBHOOK") || true
          echo "Discord webhook responded with HTTP $http_code"
          # PR #32 round-1 🟡 Finding 4 対応: curl が `-o` でファイルを作る前に
          # 失敗するエッジケース (runner で /tmp が制限される等) でも `cat` が
          # `set -e` を発火させないよう、存在チェック + `|| true` で吸収する。
          if [ "$http_code" != "204" ] && [ "$http_code" != "200" ]; then
            echo "Response body:"
            if [ -f /tmp/discord-response.txt ]; then
              cat /tmp/discord-response.txt || true
            else
              echo "(no response body — curl failed before writing to /tmp)"
            fi
          fi
