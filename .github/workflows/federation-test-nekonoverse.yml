name: Federation Test (Nekonoverse / tmux TUI)

# 連合テスト (tmux pty + httpx + 実 sakurasato-tui binary) の自動駆動。
# Issue #58 (#120 PR2a): Nekonoverse 相手に sakurasato TUI を tmux 内で実
# pty 駆動して、Follow / Reaction / Reply 等のシナリオを programmatic に
# 確かめる。PR2a 時点では Follow + Accept の smoke 1 本だけ。
#
# 起動契機:
#   - nightly cron (UTC 19:30 = JST 04:30 ── mastodon と 30 分ずらして
#     runner 競合を緩める)
#   - workflow_dispatch (= UI から手動キック)
#   - **main 向け PR** (= develop → main の release PR)。required check 化を
#     想定し、release 前に必ず通す。develop 向け PR では発火させない
#     (TUI cargo build + 外部 image 依存で 5-15 分 = 開発体験を損なうため)。
#
# 失敗時の調査:
#   1. Actions タブの個別 run ログ
#   2. "Collect logs on failure" step の出力 (各 service の tail-300)
#   3. tmux capture-pane の最終画面は pytest 側の AssertionError 本文に
#      `lib.sh` stderr として埋め込まれる

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: federation-test-nekonoverse
  cancel-in-progress: false

jobs:
  nekonoverse:
    name: Nekonoverse (tmux TUI)
    runs-on: ubuntu-latest
    # TUI binary build (cargo) + Nekonoverse image pull + DB migrate +
    # bob seed + Follow round-trip で全体 45 分上限。Mastodon stack より
    # 大きく取るのは cargo build の cold cache が長いため。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: docker compose version
        run: docker compose version

      # BuildKit cache を効かせる: tui-builder stage の cargo target を再利用。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run pytest stack
        # DEBUG_KEEP=1: pytest.sh の `trap cleanup EXIT` (= down -v) を抑止し、
        # 失敗時にコンテナを残して下の "Collect logs on failure" を実働させる
        # (#201 と同根 ── 従来は script 側 teardown が log 収集より先に走り
        # sakurasato-server 等のログが空振りしていた)。後始末は末尾の
        # "Tear down on failure" (if: always()) が行う。
        run: DEBUG_KEEP=1 ./scripts/federation-test/pytest.sh nekonoverse

      - name: Collect logs on failure
        if: failure()
        run: |
          set +e
          project="sakurasato-fed-nekonoverse-pytest"
          compose_file="compose/docker-compose.federation-nekonoverse.yml"
          for svc in sakurasato-server sakurasato-media-proxy \
                     nekonoverse-app nekonoverse-worker \
                     sakurasato-token-issuer nekonoverse-bob-issuer \
                     sakurasato-emoji-seed sakurasato-emoji-import \
                     versitygw-sks; do
            echo "==> ${svc} logs"
            docker compose -p "$project" -f "$compose_file" \
              --profile pytest logs --no-color --tail=300 "$svc" || true
          done
          echo "==> pytest logs"
          docker compose -p "$project" -f "$compose_file" \
            --profile pytest logs --no-color --tail=500 pytest || true
          # #201: 失敗時に sks 側 DB の note / delivery_queue / follow state を
          # 直接覗く。「TUI 経由の投稿/返信が server に届いて note 化されたか」を
          # ログの有無 (server は成功時 INFO を出さない) ではなく行の実在で
          # 判定できる ── reply シナリオの「posted # が出ない」系を切り分ける。
          echo "==> sks DB: note rows"
          docker compose -p "$project" -f "$compose_file" --profile pytest \
            exec -T postgres-sks psql -U sakurasato -d sakurasato -c \
            "SELECT id, left(content,40) AS content, in_reply_to_ap_id IS NOT NULL AS is_reply, is_local FROM note ORDER BY id;" || true
          echo "==> sks DB: delivery_queue rows"
          docker compose -p "$project" -f "$compose_file" --profile pytest \
            exec -T postgres-sks psql -U sakurasato -d sakurasato -c \
            "SELECT id, activity->>'type' AS type, state, left(inbox_url,50) AS inbox FROM delivery_queue ORDER BY id;" || true

      - name: Tear down on failure
        if: always()
        run: |
          project="sakurasato-fed-nekonoverse-pytest"
          docker compose -p "$project" \
            -f compose/docker-compose.federation-nekonoverse.yml \
            --profile pytest down -v --remove-orphans || true
