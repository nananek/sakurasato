[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/server",
    "crates/tui",
    "crates/media-proxy",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["nananek"]
repository = "https://github.com/nananek/sakurasato"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
sakurasato-core = { path = "crates/core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1.1"
figment = { version = "0.10", features = ["toml", "env"] }
tokio = { version = "1", features = ["full"] }
# M4 PR2 SSE: broadcast::Receiver を futures::Stream に変換するヘルパ。
# `sync` feature で `BroadcastStream` (= `Stream<Item = Result<T, _>>`) が入る。
tokio-stream = { version = "0.1", features = ["sync"] }
# axum SSE では Stream を扱うため futures::StreamExt 由来の adapter が必要。
# `std` で十分 (no_std は使わない)。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2"
url = "2"
# TUI compose で日本語 / 絵文字を 2 cell として扱う display-width 計算用
# (Issue #105: マルチバイト文字でカーソル位置がズレるバグ修正)。
unicode-width = "0.2"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono", "uuid", "json", "derive", "migrate"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
# `ws` feature ── M14 #170 で `/streaming` WebSocket stub を追加するため。
# `multipart` ── MiAuth `drive/files/create` (Aria の添付アップロード) が
# multipart/form-data を受けるため (`axum::extract::Multipart`)。
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
clap = { version = "4", features = ["derive", "env"] }
rsa = "0.9"
# Ed25519 鍵生成・PEM 入出力。HTTP 署名生成自体は M3b-2 で導入予定。
# pkcs8 / pem 機能で SigningKey / VerifyingKey の PKCS#8 PEM 入出力を有効化、
# rand_core 機能で SigningKey::generate(&mut OsRng) を生やす。
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
# Multikey (FEP-521a) のための multibase encode。
multibase = "0.9"
http = "1"
# M3b-2 HTTP 署名 (cavage RSA-SHA256 + RFC 9421 Ed25519) で使うクレート群。
# base64: Signature / Digest の base64 標準・URL safe 双方をサポート。
# httpdate: cavage の `Date` ヘッダ (IMF-fixdate) パース。
# indexmap: RFC 9421 の Signature-Input は covered components の順序が
#   署名 base に直結するため、順序保持マップが必要。
# sha2: Digest / Content-Digest の SHA-256 計算 (rsa crate 経由ではなく明示)。
# subtle: 署名値 / digest 比較を定数時間で行うため。
base64 = "0.22"
httpdate = "1"
indexmap = "2"
# `oid` feature は rsa::pkcs1v15::SigningKey<Sha256> が `AssociatedOid` を要求するため必要。
sha2 = { version = "0.10", features = ["oid"] }
subtle = "2"
# M7: SHA-256 → 小文字 hex 文字列化。`format!("{x:x}")` は配列に Display
# impl が無いため使えない。`base16ct` は no_std で動く軽量実装。
base16ct = { version = "1.0", default-features = false }
# M3b-2 PR2 アウトバウンド配送で使う HTTP クライアント。
# rustls-tls-native-roots: OpenSSL を引かず distroless で動かすため rustls + OS の root store。
# json: serde_json::Value をボディに使える .json() を有効化。
# http2: keep-alive と多重化で連合配送のレイテンシを抑える。
# default-features = false にして native-tls / cookies / blocking 等の不要機能を切る。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "http2"] }
# M4 PR1 メディア配信 (`GET /media/<key>`) で versitygw に S3 GET を投げるための SDK。
# behavior-version-latest: aws-sdk 1.x で Config::build() 時に呼び出さなくても
#   既定挙動を最新に揃える。
# rt-tokio: tokio ランタイムで動かす (本プロジェクトはこれ一択)。
# default-https-client: hyper-1 + rustls の組み合わせ — distroless で OpenSSL
#   が無くても動くようにする。
# default-features = false にしないと OpenSSL 系を引きうるので明示的に切る。
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
# `aws_sdk_s3::config::Credentials` の根本型。Static credentials を組み立てて
# `Client::from_conf` に渡すために使う (aws-config を引かず軽く済ます)。
aws-credential-types = "1"

# ── M5 TUI クライアント ──────────────────────────────────────────────
# ratatui 0.30 は内部で crossterm 0.29 を引く。crossterm を direct dependency
# にしているのは event 型 (KeyEvent / MouseEvent) を TUI 本体で扱うため。
# 必ず ratatui と版を合わせること (cargo tree -i crossterm で検査)。
# `unstable-rendered-line-info` で `Paragraph::line_count(width)` を解禁する
# (= 内部 WordWrapper による実描画と完全一致する行数を返す)。Issue #144 で
# `div_ceil(line.width(), viewport_width)` の近似がワード境界折返しと食い違い、
# 長文 note の次行アバター位置がズレる症状を踏んだため切替えた。
# unstable API なので 0.31 で API 変更があり得る ── tracking issue:
# https://github.com/ratatui/ratatui/issues/293
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
# `event-stream` feature で `EventStream` (tokio から poll する非同期版) を有効化。
# 既定の `events` / `bracketed-paste` / `windows` / `derive-more` も維持する。
crossterm = { version = "0.29", features = ["event-stream"] }
# Unix socket 越しの HTTP/1.1 クライアント。hyperlocal が `UnixConnector` を
# 提供し、`hyper-util::client::legacy::Client` と組み合わせて使う。
# server の `/api/v1/*` は Unix domain socket + Bearer 認証なのでこれで足りる。
hyperlocal = "0.9"
# hyper 1.x クライアント側。`client-legacy` / `http1` は hyperlocal が要求する。
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper = { version = "1", features = ["client", "http1"] }
# `BoxBody<Bytes, Infallible>` を作るための Empty/Full body 実装。
http-body-util = "0.1"
# hyper が body を bytes として返すので追加。
bytes = "1"
# SSE (text/event-stream) を futures::Stream<Event> としてパースする。
# `bytes` feature だけ十分 (= reqwest 同梱版でない素のストリームパーサ)。
eventsource-stream = "0.2"

# ── M5 PR2: TUI 画像対応 ─────────────────────────────────────────────
# ratatui-image: Kitty / Sixel / iTerm2 / unicode-half fallback の自動検出と
# `Image` widget。Picker::from_query_stdio() で端末問い合わせを行う。
# crossterm 0.29 とバージョンを合わせる (ratatui-image 11 系は ratatui 0.30 + crossterm 0.29 を要求)。
# `default-features = false` + `crossterm` のみ ── 以下を意図的に外している:
#   - `chafa-dyn` (libchafa の system 依存)
#   - `image-defaults` (= image/default。AVIF を含む全コーデックを引き、`ravif`
#     / `rav1e` (AV1 エンコーダ) という不要に大きい依存を持ち込む)
# `image` crate は workspace 側で `["png", "jpeg", "webp", "gif"]` を直接指定する
# ので、`image-defaults` が無くてもアバターのデコードは可能。
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
# `image` crate (= ratatui-image が内部で使うものに揃える)。Avatar デコードの
# ために server 本体ではなく TUI クライアントで使う ── 信頼できないバイト列を
# server コンテナで decode しない設計 (CLAUDE.md §7) は維持される。
# default-features を保ち、PNG / JPEG / WebP / GIF を対応にする (最低限のフォーマット)。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# LRU は実用十分な小さい実装。`lru` crate は put/get が O(1)。
lru = "0.18"

# ── M6 media-proxy ─────────────────────────────────────────────────
# media-proxy は本体 server とは別バイナリ (= 別プロセス + 別 docker container)
# として動かし、外部 GET と画像デコードという危険な処理だけを引き受ける。
# 本体 (`crates/server`) には `image` を引き込まない契約は維持する。
#
# media-proxy 内部:
#   - axum を使って Unix socket 上で HTTP/1.1 を listen する
#     (axum 0.8 は `serve` API で listener を受け取れる)
#   - reqwest で外部 GET (workspace 既定の rustls-tls-native-roots)
#   - image で decode / resize / WebP 再エンコード
#   - webp (libwebp 経由) で **animated WebP** 再エンコード (#129)
#     `image` crate の WebP encoder は still 限定で、animated GIF / APNG /
#     animated WebP を first-frame に潰す。`webp` crate は libwebp-sys を
#     vendored で内包し AnimEncoder API を提供 ── unsafe は dep 内に閉じ、
#     本 crate の `#![forbid(unsafe_code)]` は維持される。default の `img`
#     feature で `image::DynamicImage` ↔ AnimFrame 変換が使える。
#     libwebp-sys (transitive) は `parallel` 既定 = libwebp の pthread 並列化を
#     musl 静的リンクで取り込む ── alpine builder の musl-dev に pthread が
#     同梱されており追加依存なし。
webp = "0.3"

# ── M8 emoji zip インポート ────────────────────────────────────────
# Misskey 形式 zip (meta.json + 画像群) を server CLI で取り込むために使う。
# - `default-features = false` で aes / bzip2 / lzma / zstd / xz といった
#   暗号化・レアな圧縮形式を切り、Misskey export が使う素の (= deflate のみ)
#   zip を扱える最小構成にする。
# - `deflate-flate2-zlib-rs` は pure-Rust の zlib 実装 (zlib-rs) を使い、
#   OpenSSL / native zlib を引かない (distroless 互換を維持)。
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# ── M14 #157: MiAuth foundation ─────────────────────────────────────
# Misskey MiAuth (= 親 issue #150) はクライアント生成 UUID を session 識別子
# として使う。`v4` で `Uuid::new_v4()` (= テスト fixtures 用)、`serde` で
# JSON 直列化を有効化。`sqlx` の `uuid` feature 経由で `Uuid` ↔ `UUID` 列の
# encode/decode は既に通る ── ここで明示 dep を持つことで、CLI / handler が
# `Uuid::parse_str` 等で文字列受けする経路を素直に書ける (sqlx::types::Uuid
# 再export だけだと feature 経路が間接的でリファクタが脆い)。
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
