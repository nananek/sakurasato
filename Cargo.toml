[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/server",
    "crates/tui",
    "crates/media-proxy",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["nananek"]
repository = "https://github.com/nananek/sakurasato"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
sakurasato-core = { path = "crates/core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2"
url = "2"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono", "uuid", "json", "derive", "migrate"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
clap = { version = "4", features = ["derive"] }
rsa = "0.9"
# Ed25519 鍵生成・PEM 入出力。HTTP 署名生成自体は M3b-2 で導入予定。
# pkcs8 / pem 機能で SigningKey / VerifyingKey の PKCS#8 PEM 入出力を有効化、
# rand_core 機能で SigningKey::generate(&mut OsRng) を生やす。
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
# Multikey (FEP-521a) のための multibase encode。
multibase = "0.9"
http = "1"
# M3b-2 HTTP 署名 (cavage RSA-SHA256 + RFC 9421 Ed25519) で使うクレート群。
# base64: Signature / Digest の base64 標準・URL safe 双方をサポート。
# httpdate: cavage の `Date` ヘッダ (IMF-fixdate) パース。
# indexmap: RFC 9421 の Signature-Input は covered components の順序が
#   署名 base に直結するため、順序保持マップが必要。
# sha2: Digest / Content-Digest の SHA-256 計算 (rsa crate 経由ではなく明示)。
# subtle: 署名値 / digest 比較を定数時間で行うため。
base64 = "0.22"
httpdate = "1"
indexmap = "2"
# `oid` feature は rsa::pkcs1v15::SigningKey<Sha256> が `AssociatedOid` を要求するため必要。
sha2 = { version = "0.10", features = ["oid"] }
subtle = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
