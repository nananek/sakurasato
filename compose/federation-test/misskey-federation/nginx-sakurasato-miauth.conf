# M14 #162: federation-misskey 専用 nginx 設定。
#
# 通常の `_common/nginx-sakurasato.conf` は `/` を `sakurasato-server:8080`
# (= public AP listener) に振るだけだが、本 stack では MiAuth listener
# (= `tcp://0.0.0.0:8081`) も同 host (= `sakurasato`) で公開する必要がある。
#
# 振り分け:
#
#   /miauth/*           → 8081 (= MiAuth listener: browser landing)
#   /api/*              → 8081 (= MiAuth listener: 全 /api/ endpoint)
#   /                   → 8080 (= public AP / WebFinger / NodeInfo / actor)
#
# 設計選択:
# - `/api/` prefix を **blanket で 8081** に振る。MiAuth listener が持つ
#   `/api/i` / `/api/miauth/*` / `/api/meta` / `/api/stats` / `/api/notes/*` /
#   `/api/users/*` / `/api/emojis` / `/api/following/*` を一括カバー。
# - AP listener (= `routes::router`) には `/api/` 系の path が 1 つも無い
#   ので blanket で振っても conflict しない。
# - 旧形 (= `/api/i` 単体 + `/api/miauth/` 単体) で残すと M14 #168 で追加した
#   `/api/meta` / `/api/stats` や #159-#160 の `/api/notes/*` 等が AP listener
#   に fallthrough して 404 になる (= parity test 全滅)。M14 #168 で一括修正。
# - `/.well-known/nodeinfo` と `/nodeinfo/2.1` は AP / MiAuth 両 listener に
#   handlers がある (= MiAuth #168 で追加)。`/` fallthrough で AP listener が
#   応答すれば parity test は通る (= 値はインスタンス単位で共通) ので明示
#   ルーティングは省略する。

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/sakurasato.crt;
        ssl_certificate_key /certs/sakurasato.key;

        # MiAuth listener (= 8081)。browser landing。
        location /miauth/ {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # MiAuth listener の全 `/api/` endpoint を blanket で 8081 に振る。
        # AP listener は `/api/` 系を持たないため conflict しない。
        location /api/ {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # MiAuth listener の WebSocket streaming (= /streaming)。AP listener には
        # 無いので明示的に 8081 へ振る (#201: 旧設定では `/` に fallthrough して
        # AP listener (8080) に飛び 404 になっていた)。WebSocket upgrade ヘッダ要。
        location /streaming {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # public AP listener (= 8080)。WebFinger / NodeInfo / actor JSON 等。
        location / {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
