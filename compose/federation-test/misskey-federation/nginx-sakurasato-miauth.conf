# M14 #162: federation-misskey 専用 nginx 設定。
#
# 通常の `_common/nginx-sakurasato.conf` は `/` を `sakurasato-server:8080`
# (= public AP listener) に振るだけだが、本 stack では MiAuth listener
# (= `tcp://0.0.0.0:8081`) も同 host (= `sakurasato`) で公開する必要がある。
#
# 振り分け:
#
#   /miauth/*           → 8081 (= MiAuth listener)
#   /api/miauth/*       → 8081
#   /api/i              → 8081
#   /                   → 8080 (= public AP / WebFinger / NodeInfo / nodeinfo)
#
# Misskey 公式 spec で MiAuth は `https://<host>/miauth/{uuid}` と
# `https://<host>/api/miauth/{uuid}/check` / `https://<host>/api/i` を要求する
# ので、host 名は同じで path で分岐する設計にする。

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/sakurasato.crt;
        ssl_certificate_key /certs/sakurasato.key;

        # MiAuth listener (= 8081)。location は longest-prefix-match で振り分け
        # られる。`/api/i` は exact match を `=` で取って `/api/i/foo` 等が
        # `/api/` (= public AP の future expansion) と紛れないようにする。
        location /miauth/ {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/miauth/ {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/i {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # public AP listener (= 8080)。WebFinger / NodeInfo / actor JSON 等。
        location / {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
