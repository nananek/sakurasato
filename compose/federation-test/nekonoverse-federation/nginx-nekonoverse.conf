# TLS-terminating reverse proxy in front of Nekonoverse (federation test).
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/nekonoverse.crt;
        ssl_certificate_key /certs/nekonoverse.key;

        location / {
            set $upstream nekonoverse-app;
            proxy_pass http://$upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
