# TLS-terminating reverse proxy in front of sakurasato-server-new (#140 PR2).
#
# Scenario A (2-sks Move) では sks-old (`sakurasato`) と sks-new (`sakurasato-new`)
# の 2 vhost が同 compose 内で並走する。1-sks 用の `nginx-sakurasato.conf` を
# そのまま使えないのは、cert path (`sakurasato-new.{crt,key}`) と upstream
# (`sakurasato-server-new`) を別 host に向ける必要があるため。
#
# 構成は 1-sks 版 (`nginx-sakurasato.conf`) と同形で、cert / upstream の 2 か所
# だけ差し替えてある。compose 側で `nginx-sks-new` service が本ファイルを
# `/etc/nginx/nginx.conf` にマウントする。
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/sakurasato-new.crt;
        ssl_certificate_key /certs/sakurasato-new.key;

        location / {
            set $upstream sakurasato-server-new;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
