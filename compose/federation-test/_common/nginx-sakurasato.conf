# TLS-terminating reverse proxy in front of sakurasato-server.
#
# Federation tests use this on every compose file — sakurasato itself does
# not ship TLS termination (production assumes an external proxy like caddy).
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 10M;

        ssl_certificate /certs/sakurasato.crt;
        ssl_certificate_key /certs/sakurasato.key;

        location / {
            set $upstream sakurasato-server;
            proxy_pass http://$upstream:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
