# Nekonoverse ↔ sakurasato 連合テスト (M3b-2 PR3)。
#
# **Ed25519 検証の主対向**: nekonoverse は FEP-521a Multikey + dual-key
# (RSA + Ed25519) 完備で、RFC 9421 + Ed25519 経路を本物の他実装相手に
# 試せる数少ない選択肢の 1 つ (もう 1 つは Mitra)。
#
# inline build に github の develop ブランチを使う。初回は backend image の
# ビルドに数分かかる。
#
# 起動: scripts/federation-test/up.sh nekonoverse
# 停止: scripts/federation-test/down.sh nekonoverse

services:
  certs:
    image: alpine:3.21
    command: >
      sh -c "apk add --no-cache openssl >/dev/null 2>&1 && /gen-certs.sh"
    environment:
      CERT_DOMAINS: sakurasato,nekonoverse
    volumes:
      - certs:/certs
      - ./federation-test/_common/gen-certs.sh:/gen-certs.sh:ro

  # ── Sakurasato Instance ───────────────────────────────────
  postgres-sks:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sakurasato
      POSTGRES_USER: sakurasato
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: pg_isready -U sakurasato
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - nekonoverse-fed

  # versitygw (S3 互換オブジェクトストレージ) ── #120 PR2c で emoji import が
  # 必須になった。本番 `docker-compose.yml` の `versitygw` を test 用に薄く
  # 焼き直し: secret は plain env `ROOT_SECRET_ACCESS_KEY` で渡す (= 本番は
  # `/run/secrets/s3_secret_key`、test stack は単一 host で平文 OK)。
  #
  # **bucket dir の事前作成**: versitygw の posix backend は bucket を
  # サブディレクトリとして扱う。本番では運用フェーズで CreateBucket を叩く
  # 前提 (= server 自体は bucket 作らない設計) なので、test stack でも
  # entrypoint で `mkdir -p /data/sakurasato` してから versitygw を exec する。
  versitygw-sks:
    build:
      context: ..
      dockerfile: docker/versitygw.Dockerfile
    image: sakurasato/versitygw:dev
    entrypoint:
      - /bin/sh
      - -c
      - 'mkdir -p /data/sakurasato && exec versitygw --port=:7070 --access=sakurasato posix /data'
    environment:
      ROOT_SECRET_ACCESS_KEY: testpass
    volumes:
      - versitygw_sks_data:/data
    networks:
      - nekonoverse-fed

  sakurasato-init:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: sakurasato/server:dev
    command: ["init", "--display-name", "Sakurasato Test"]
    environment: &sakurasato_env
      SAKURASATO_DATABASE__URL: postgres://sakurasato:testpass@postgres-sks:5432/sakurasato
      SAKURASATO_SERVER__HOST: sakurasato
      SAKURASATO_SERVER__USER: me
      # #120 PR2c: emoji import が versitygw に PUT するので、init / server /
      # emoji-import の 3 サービスで storage 接続情報を共有する (= YAML anchor)。
      SAKURASATO_STORAGE__ENDPOINT: http://versitygw-sks:7070
      SAKURASATO_STORAGE__ACCESS_KEY_ID: sakurasato
      SAKURASATO_STORAGE__SECRET_ACCESS_KEY: testpass
      SAKURASATO_STORAGE__BUCKET: sakurasato
      SSL_CERT_FILE: /certs/ca.crt
    depends_on:
      postgres-sks:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
    networks:
      - nekonoverse-fed
    restart: "no"

  sakurasato-server:
    image: sakurasato/server:dev
    command: ["serve"]
    environment:
      <<: *sakurasato_env
      # PR2a (#58 PR1+PR2) で TUI が pytest コンテナから本 socket に繋がる
      # ので、Mastodon stack と同じ `/home/nonroot/local.sock` (= 共有 volume
      # `sakurasato_local_api` 経由で 65532:65532 0o700) に置く。
      SAKURASATO_SERVER__LOCAL_API_SOCKET: /home/nonroot/local.sock
      SAKURASATO_MEDIA_PROXY__SOCKET: /run/sakurasato/media.sock
    depends_on:
      sakurasato-init:
        condition: service_completed_successfully
      sakurasato-media-proxy:
        condition: service_healthy
      versitygw-sks:
        condition: service_started
    volumes:
      - certs:/certs:ro
      # pytest container が `/home/nonroot/local.sock` を共有 UDS として開く。
      - sakurasato_local_api:/home/nonroot
      # follow CLI が WebFinger 解決を media-proxy 経由で行うので、socket
      # を共有する必要がある。
      - media_sock:/run/sakurasato
    networks:
      - nekonoverse-fed

  # M10 PR #51 で `follow` CLI の WebFinger 解決が media-proxy 経由に移った
  # ため、`:follow bob@nekonoverse` が成立するには media-proxy が立っている
  # 必要がある。Mastodon stack と同じ構成。
  sakurasato-media-proxy:
    build:
      context: ..
      dockerfile: docker/media-proxy.Dockerfile
    image: sakurasato/media-proxy:dev
    environment:
      SAKURASATO_MEDIA_PROXY__SOCKET: /run/sakurasato/media.sock
      SSL_CERT_FILE: /certs/ca.crt
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - media_sock:/run/sakurasato
    healthcheck:
      test: ["CMD", "/app/sakurasato-media-proxy", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    networks:
      - nekonoverse-fed

  nginx-sks:
    image: nginx:alpine
    volumes:
      - ./federation-test/_common/nginx-sakurasato.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      sakurasato-server:
        condition: service_started
      certs:
        condition: service_completed_successfully
    networks:
      nekonoverse-fed:
        aliases:
          - sakurasato

  # ── Nekonoverse Instance ──────────────────────────────────
  postgres-neko:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nekonoverse
      POSTGRES_USER: nekonoverse
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: pg_isready -U nekonoverse
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - nekonoverse-fed

  valkey-neko:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: valkey-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - nekonoverse-fed

  nekonoverse-app:
    # nekonoverse の docker-publish workflow が tag push 時に publish する
    # `:latest` を引く。以前は inline build (`#develop:backend` の git context)
    # を使っていたが、private submodule (`claude-md`) が追加されて buildkit が
    # `--recurse-submodules` で詰まる事案があり、image pull に切替。
    image: ghcr.io/nekonoverse/nekonoverse-backend:latest
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info"
    environment:
      DATABASE_URL: postgresql+asyncpg://nekonoverse:testpass@postgres-neko:5432/nekonoverse
      VALKEY_URL: valkey://valkey-neko:6379/0
      DOMAIN: nekonoverse
      SECRET_KEY: test-secret-key-neko
      FRONTEND_URL: https://nekonoverse
      DEBUG: "true"
      REGISTRATION_OPEN: "true"
      SKIP_SSL_VERIFY: "true"
      ALLOW_PRIVATE_NETWORKS: "true"
    depends_on:
      postgres-neko:
        condition: service_healthy
      valkey-neko:
        condition: service_healthy
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - nekonoverse-fed

  nekonoverse-worker:
    # app と同じ image を使う (元は inline build の dev tag を再利用していたが
    # ghcr 切替で同じ tag を引く形にした)。
    image: ghcr.io/nekonoverse/nekonoverse-backend:latest
    command: python -m app.worker.main
    environment:
      DATABASE_URL: postgresql+asyncpg://nekonoverse:testpass@postgres-neko:5432/nekonoverse
      VALKEY_URL: valkey://valkey-neko:6379/0
      DOMAIN: nekonoverse
      SECRET_KEY: test-secret-key-neko
      FRONTEND_URL: https://nekonoverse
      DEBUG: "true"
      REGISTRATION_OPEN: "true"
      SKIP_SSL_VERIFY: "true"
      ALLOW_PRIVATE_NETWORKS: "true"
    depends_on:
      nekonoverse-app:
        condition: service_healthy
    networks:
      - nekonoverse-fed

  nginx-neko:
    image: nginx:alpine
    volumes:
      - ./federation-test/nekonoverse-federation/nginx-nekonoverse.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      nekonoverse-app:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    networks:
      nekonoverse-fed:
        aliases:
          - nekonoverse

  # ── pytest profile (#58 / #120 PR2a) ─────────────────────────
  # `scripts/federation-test/pytest.sh nekonoverse` から発火。
  # `up.sh nekonoverse` (= 手動 e2e) では起動しない。

  # sakurasato 側のローカル API Bearer トークンを発行して共有 volume に出す。
  # Mastodon stack と同じパターン。
  sakurasato-token-issuer:
    image: sakurasato/server:dev
    command: ["token", "issue", "--name", "pytest", "--out", "/home/nonroot/pytest.token"]
    environment:
      SAKURASATO_DATABASE__URL: postgres://sakurasato:testpass@postgres-sks:5432/sakurasato
      SAKURASATO_SERVER__HOST: sakurasato
      SAKURASATO_SERVER__USER: me
      SSL_CERT_FILE: /certs/ca.crt
    depends_on:
      sakurasato-init:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - sakurasato_local_api:/home/nonroot
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

  # Nekonoverse 側に bob アカウントを headless 登録 + user-level OAuth token を
  # **DB 直 seed** する (#58 / #120 PR2b)。token は共有 named volume
  # `nekonoverse_tokens` に `bob.token` として書き出し、pytest 側で
  # `NEKONOVERSE_TOKEN_FILE` 経由で読む (= Mastodon stack の Doorkeeper 直 seed
  # と同じ pattern)。
  #
  # OAuth `authorization_code` dance を回避し DB 直 INSERT に倒した経緯は
  # `seed-bob.sh` の冒頭コメント参照 (Nekonoverse は password grant が無く、
  # authorize 経路は CSRF + 強制同意画面で curl 完走コストが高いため)。
  nekonoverse-bob-issuer:
    image: alpine:3.21
    # postgresql-client を追加 (#120 PR2b で oauth_tokens 直 seed に使う)。
    # 既存 curl / jq / ca-certificates と同じ apk 行に並べる。
    command: >
      sh -c "apk add --no-cache curl jq ca-certificates postgresql-client >/dev/null &&
             cp /certs/ca.crt /usr/local/share/ca-certificates/test-ca.crt &&
             update-ca-certificates >/dev/null &&
             /seed-bob.sh"
    environment:
      NKV_BASE: https://nekonoverse
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # DB 直 seed 用接続情報 (postgres-neko service と整合)。
      NKV_DB_HOST: postgres-neko
      NKV_DB_PORT: "5432"
      NKV_DB_USER: nekonoverse
      NKV_DB_NAME: nekonoverse
      NKV_DB_PASSWORD: testpass
      # 共有 volume `nekonoverse_tokens` の mount 先と一致させる。
      NKV_TOKEN_OUT: /nkv-tokens/bob.token
    depends_on:
      nekonoverse-app:
        condition: service_healthy
      nginx-neko:
        condition: service_started
      certs:
        condition: service_completed_successfully
      postgres-neko:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
      - ./federation-test/nekonoverse-federation/seed-bob.sh:/seed-bob.sh:ro
      # 書き出した token を pytest と共有する (本サービスは RW、pytest は RO)。
      - nekonoverse_tokens:/nkv-tokens
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

  # #140 Scenario B (nkv→sks Move) 用の 2nd nkv user `bobnew` を headless 登録 +
  # oauth_tokens 直 seed する 1-shot service。`nekonoverse-bob-issuer` と同じ
  # seed-bob.sh を **BOB_USERNAME=bobnew** で再利用するだけ (= Nekonoverse は
  # 登録で token を返さないため、Move target も bob と同じ DB-seed 経路でしか
  # Bearer を得られない)。raw token は `/nkv-tokens/bob_new.token` に出力し、
  # pytest は read-only で読む (= pytest コンテナを DB-free に保つ既存不変条件を
  # 維持。動的登録だと pytest に DB 認証情報が要るのを避ける)。
  nekonoverse-bob-new-issuer:
    image: alpine:3.21
    command: >
      sh -c "apk add --no-cache curl jq ca-certificates postgresql-client >/dev/null &&
             cp /certs/ca.crt /usr/local/share/ca-certificates/test-ca.crt &&
             update-ca-certificates >/dev/null &&
             /seed-bob.sh"
    environment:
      NKV_BASE: https://nekonoverse
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      NKV_DB_HOST: postgres-neko
      NKV_DB_PORT: "5432"
      NKV_DB_USER: nekonoverse
      NKV_DB_NAME: nekonoverse
      NKV_DB_PASSWORD: testpass
      # bob とは別 user。固定 username (stack ごとに DB が down -v されるので
      # 衝突しない。同 stack 再 run は seed-bob.sh の 422 idempotent 経路が拾う)。
      BOB_USERNAME: bobnew
      BOB_EMAIL: bobnew@bobnew.nekonoverse.dev
      NKV_TOKEN_OUT: /nkv-tokens/bob_new.token
    depends_on:
      nekonoverse-app:
        condition: service_healthy
      nginx-neko:
        condition: service_started
      certs:
        condition: service_completed_successfully
      postgres-neko:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
      - ./federation-test/nekonoverse-federation/seed-bob.sh:/seed-bob.sh:ro
      - nekonoverse_tokens:/nkv-tokens
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

  # Sakurasato 側にテスト用カスタム絵文字 `:sakurasato_test:` を **import** する
  # 1-shot service (#58 / #120 PR2c)。`reaction_custom_emoji` シナリオで TUI が
  # `:sakurasato_test:` を発火するために、import 前に local emoji 行が DB に
  # 入っている必要がある。
  #
  # 2 段構え:
  #   1. `sakurasato-emoji-seed` (alpine + zip) が Misskey 形式 zip を build し
  #      共有 volume `sakurasato_seed_emoji` に出す。
  #   2. `sakurasato-emoji-import` (sakurasato/server:dev) が同 zip を
  #      `emoji import` CLI で取り込む。media-proxy → versitygw 経由で
  #      `:sakurasato_test:` の local emoji 行 + S3 object が作られる。
  sakurasato-emoji-seed:
    image: alpine:3.21
    # zip = Info-ZIP の `zip` バイナリ。coreutils = base64 -d (busybox の
    # base64 は `-d` を読まないことがあるため確実な GNU 系を入れる)。
    command: >
      sh -c "apk add --no-cache zip coreutils >/dev/null &&
             /seed-emoji.sh"
    environment:
      SEED_EMOJI_OUT: /seed-emoji/sakurasato_test.zip
    volumes:
      - ./federation-test/nekonoverse-federation/seed-emoji.sh:/seed-emoji.sh:ro
      - sakurasato_seed_emoji:/seed-emoji
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

  sakurasato-emoji-import:
    image: sakurasato/server:dev
    command: ["emoji", "import", "/seed-emoji/sakurasato_test.zip"]
    environment:
      # `&sakurasato_env` (init / server と同じ DB + storage env) に
      # media-proxy socket を追加。emoji import は media-proxy で sanitize →
      # versitygw に PUT するため、`SAKURASATO_STORAGE__*` 4 件と
      # `SAKURASATO_MEDIA_PROXY__SOCKET` の両方が必須。
      <<: *sakurasato_env
      SAKURASATO_MEDIA_PROXY__SOCKET: /run/sakurasato/media.sock
    depends_on:
      sakurasato-init:
        condition: service_completed_successfully
      sakurasato-media-proxy:
        condition: service_healthy
      sakurasato-emoji-seed:
        condition: service_completed_successfully
      versitygw-sks:
        condition: service_started
    volumes:
      - certs:/certs:ro
      - media_sock:/run/sakurasato
      - sakurasato_seed_emoji:/seed-emoji:ro
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

  pytest:
    build:
      # Context = repo root so the multi-stage build can pull `crates/`,
      # `vendor/`, `scripts/tmux-e2e/` for building the TUI binary and
      # bundling the tmux harness. Compose YAML resolves `context` relative
      # to the YAML file location (= `compose/`), so `..` lands at the
      # repo root (mirrors `sakurasato-init` build context).
      context: ..
      dockerfile: tests/federation/Dockerfile.tmux
    image: sakurasato/federation-pytest-tmux:dev
    command: ["pytest", "-xvs", "--tb=short", "test_nekonoverse_tui.py"]
    environment:
      SAKURASATO_BASE_URL: https://sakurasato
      SAKURASATO_DOMAIN: sakurasato
      SAKURASATO_LOCAL_API_SOCKET: /home/nonroot/local.sock
      SAKURASATO_TOKEN_FILE: /home/nonroot/pytest.token
      NEKONOVERSE_BASE_URL: https://nekonoverse
      NEKONOVERSE_DOMAIN: nekonoverse
      NEKONOVERSE_USERNAME: bob
      # bob 用 OAuth Bearer (PR2b で DB 直 seed)。`nekonoverse-bob-issuer` が
      # 書き出した raw token をここで読む。
      NEKONOVERSE_TOKEN_FILE: /nkv-tokens/bob.token
      # #140 Scenario B: Move target `bobnew` の Bearer (bob-new-issuer が seed)。
      NEKONOVERSE_BOB_NEW_TOKEN_FILE: /nkv-tokens/bob_new.token
      # PR2c で seed する custom emoji の shortcode。test 側 fixture と
      # 揃えるため env で渡しておく (= seed と test の不整合を避ける)。
      SAKURASATO_SEED_EMOJI_SHORTCODE: sakurasato_test
      # Mastodon stack を立てていないので autouse wait を OFF にする。
      MASTODON_ENABLED: "0"
      NEKONOVERSE_ENABLED: "1"
      SSL_CERT_FILE: /certs/ca.crt
      REQUESTS_CA_BUNDLE: /certs/ca.crt
      # tmux に与える window サイズはコンテナ TERM の影響を受けないよう
      # lib.sh 内で `-x 200 -y 50` 固定。env 上書きの余地は残しておく。
      TERM: xterm-256color
    user: "65532:65532"
    depends_on:
      sakurasato-server:
        condition: service_started
      sakurasato-token-issuer:
        condition: service_completed_successfully
      sakurasato-emoji-import:
        condition: service_completed_successfully
      nekonoverse-bob-issuer:
        condition: service_completed_successfully
      nekonoverse-bob-new-issuer:
        condition: service_completed_successfully
      nekonoverse-worker:
        condition: service_started
      nginx-neko:
        condition: service_started
      nginx-sks:
        condition: service_started
    volumes:
      - certs:/certs:ro
      - sakurasato_local_api:/home/nonroot:ro
      # bob token は read-only でマウント (= pytest からは読むだけ、issue は
      # `nekonoverse-bob-issuer` のみが行う)。
      - nekonoverse_tokens:/nkv-tokens:ro
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

volumes:
  certs:
  media_sock:
  # sakurasato local API UDS + token を pytest と共有する。Mastodon stack と
  # 名前を揃えてあるので、CI から見たときに同じ意味合いで覗ける。
  sakurasato_local_api:
  # bob 用 OAuth Bearer (raw token) を nekonoverse-bob-issuer → pytest で共有
  # する named volume (#120 PR2b)。
  nekonoverse_tokens:
  # `:sakurasato_test:` の seed zip を seed → import 1-shot 間で受け渡す
  # named volume (#120 PR2c)。pytest 本体は触らない。
  sakurasato_seed_emoji:
  # versitygw が emoji import の S3 PUT を受け止める POSIX backend。
  # `:sakurasato_test:` の webp はここに置かれる (#120 PR2c)。
  versitygw_sks_data:

networks:
  nekonoverse-fed:
    driver: bridge
