# Nekonoverse ↔ sakurasato 連合テスト (M3b-2 PR3)。
#
# **Ed25519 検証の主対向**: nekonoverse は FEP-521a Multikey + dual-key
# (RSA + Ed25519) 完備で、RFC 9421 + Ed25519 経路を本物の他実装相手に
# 試せる数少ない選択肢の 1 つ (もう 1 つは Mitra)。
#
# inline build に github の develop ブランチを使う。初回は backend image の
# ビルドに数分かかる。
#
# 起動: scripts/federation-test/up.sh nekonoverse
# 停止: scripts/federation-test/down.sh nekonoverse

services:
  certs:
    image: alpine:3.21
    command: >
      sh -c "apk add --no-cache openssl >/dev/null 2>&1 && /gen-certs.sh"
    environment:
      CERT_DOMAINS: sakurasato,nekonoverse
    volumes:
      - certs:/certs
      - ./federation-test/_common/gen-certs.sh:/gen-certs.sh:ro

  # ── Sakurasato Instance ───────────────────────────────────
  postgres-sks:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sakurasato
      POSTGRES_USER: sakurasato
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: pg_isready -U sakurasato
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - nekonoverse-fed

  sakurasato-init:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: sakurasato/server:dev
    command: ["init", "--display-name", "Sakurasato Test"]
    environment:
      SAKURASATO_DATABASE__URL: postgres://sakurasato:testpass@postgres-sks:5432/sakurasato
      SAKURASATO_SERVER__HOST: sakurasato
      SAKURASATO_SERVER__USER: me
      SSL_CERT_FILE: /certs/ca.crt
    depends_on:
      postgres-sks:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
    networks:
      - nekonoverse-fed
    restart: "no"

  sakurasato-server:
    image: sakurasato/server:dev
    command: ["serve"]
    environment:
      SAKURASATO_DATABASE__URL: postgres://sakurasato:testpass@postgres-sks:5432/sakurasato
      SAKURASATO_SERVER__HOST: sakurasato
      SAKURASATO_SERVER__USER: me
      # PR2a (#58 PR1+PR2) で TUI が pytest コンテナから本 socket に繋がる
      # ので、Mastodon stack と同じ `/home/nonroot/local.sock` (= 共有 volume
      # `sakurasato_local_api` 経由で 65532:65532 0o700) に置く。
      SAKURASATO_SERVER__LOCAL_API_SOCKET: /home/nonroot/local.sock
      SAKURASATO_MEDIA_PROXY__SOCKET: /run/sakurasato/media.sock
      SSL_CERT_FILE: /certs/ca.crt
    depends_on:
      sakurasato-init:
        condition: service_completed_successfully
      sakurasato-media-proxy:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
      # pytest container が `/home/nonroot/local.sock` を共有 UDS として開く。
      - sakurasato_local_api:/home/nonroot
      # follow CLI が WebFinger 解決を media-proxy 経由で行うので、socket
      # を共有する必要がある。
      - media_sock:/run/sakurasato
    networks:
      - nekonoverse-fed

  # M10 PR #51 で `follow` CLI の WebFinger 解決が media-proxy 経由に移った
  # ため、`:follow bob@nekonoverse` が成立するには media-proxy が立っている
  # 必要がある。Mastodon stack と同じ構成。
  sakurasato-media-proxy:
    build:
      context: ..
      dockerfile: docker/media-proxy.Dockerfile
    image: sakurasato/media-proxy:dev
    environment:
      SAKURASATO_MEDIA_PROXY__SOCKET: /run/sakurasato/media.sock
      SSL_CERT_FILE: /certs/ca.crt
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - media_sock:/run/sakurasato
    healthcheck:
      test: ["CMD", "/app/sakurasato-media-proxy", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    networks:
      - nekonoverse-fed

  nginx-sks:
    image: nginx:alpine
    volumes:
      - ./federation-test/_common/nginx-sakurasato.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      sakurasato-server:
        condition: service_started
      certs:
        condition: service_completed_successfully
    networks:
      nekonoverse-fed:
        aliases:
          - sakurasato

  # ── Nekonoverse Instance ──────────────────────────────────
  postgres-neko:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nekonoverse
      POSTGRES_USER: nekonoverse
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: pg_isready -U nekonoverse
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - nekonoverse-fed

  valkey-neko:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: valkey-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - nekonoverse-fed

  nekonoverse-app:
    # nekonoverse の docker-publish workflow が tag push 時に publish する
    # `:latest` を引く。以前は inline build (`#develop:backend` の git context)
    # を使っていたが、private submodule (`claude-md`) が追加されて buildkit が
    # `--recurse-submodules` で詰まる事案があり、image pull に切替。
    image: ghcr.io/nekonoverse/nekonoverse-backend:latest
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info"
    environment:
      DATABASE_URL: postgresql+asyncpg://nekonoverse:testpass@postgres-neko:5432/nekonoverse
      VALKEY_URL: valkey://valkey-neko:6379/0
      DOMAIN: nekonoverse
      SECRET_KEY: test-secret-key-neko
      FRONTEND_URL: https://nekonoverse
      DEBUG: "true"
      REGISTRATION_OPEN: "true"
      SKIP_SSL_VERIFY: "true"
      ALLOW_PRIVATE_NETWORKS: "true"
    depends_on:
      postgres-neko:
        condition: service_healthy
      valkey-neko:
        condition: service_healthy
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - nekonoverse-fed

  nekonoverse-worker:
    # app と同じ image を使う (元は inline build の dev tag を再利用していたが
    # ghcr 切替で同じ tag を引く形にした)。
    image: ghcr.io/nekonoverse/nekonoverse-backend:latest
    command: python -m app.worker.main
    environment:
      DATABASE_URL: postgresql+asyncpg://nekonoverse:testpass@postgres-neko:5432/nekonoverse
      VALKEY_URL: valkey://valkey-neko:6379/0
      DOMAIN: nekonoverse
      SECRET_KEY: test-secret-key-neko
      FRONTEND_URL: https://nekonoverse
      DEBUG: "true"
      REGISTRATION_OPEN: "true"
      SKIP_SSL_VERIFY: "true"
      ALLOW_PRIVATE_NETWORKS: "true"
    depends_on:
      nekonoverse-app:
        condition: service_healthy
    networks:
      - nekonoverse-fed

  nginx-neko:
    image: nginx:alpine
    volumes:
      - ./federation-test/nekonoverse-federation/nginx-nekonoverse.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      nekonoverse-app:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    networks:
      nekonoverse-fed:
        aliases:
          - nekonoverse

  # ── pytest profile (#58 / #120 PR2a) ─────────────────────────
  # `scripts/federation-test/pytest.sh nekonoverse` から発火。
  # `up.sh nekonoverse` (= 手動 e2e) では起動しない。

  # sakurasato 側のローカル API Bearer トークンを発行して共有 volume に出す。
  # Mastodon stack と同じパターン。
  sakurasato-token-issuer:
    image: sakurasato/server:dev
    command: ["token", "issue", "--name", "pytest", "--out", "/home/nonroot/pytest.token"]
    environment:
      SAKURASATO_DATABASE__URL: postgres://sakurasato:testpass@postgres-sks:5432/sakurasato
      SAKURASATO_SERVER__HOST: sakurasato
      SAKURASATO_SERVER__USER: me
      SSL_CERT_FILE: /certs/ca.crt
    depends_on:
      sakurasato-init:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - sakurasato_local_api:/home/nonroot
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

  # Nekonoverse 側に bob アカウントを headless 登録する (= WebFinger で引ける
  # 状態にする)。PR2a スコープでは user-level token は取らない ── pytest 側は
  # public な `/api/v1/accounts/lookup` + `/api/v1/accounts/{id}/followers` で
  # Follow + Accept round-trip を検証する。alpine + curl + jq の最小構成。
  nekonoverse-bob-issuer:
    image: alpine:3.21
    command: >
      sh -c "apk add --no-cache curl jq ca-certificates >/dev/null &&
             cp /certs/ca.crt /usr/local/share/ca-certificates/test-ca.crt &&
             update-ca-certificates >/dev/null &&
             /seed-bob.sh"
    environment:
      NKV_BASE: https://nekonoverse
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    depends_on:
      nekonoverse-app:
        condition: service_healthy
      nginx-neko:
        condition: service_started
      certs:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - ./federation-test/nekonoverse-federation/seed-bob.sh:/seed-bob.sh:ro
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

  pytest:
    build:
      # Context = repo root so the multi-stage build can pull `crates/`,
      # `vendor/`, `scripts/tmux-e2e/` for building the TUI binary and
      # bundling the tmux harness. Compose YAML resolves `context` relative
      # to the YAML file location (= `compose/`), so `..` lands at the
      # repo root (mirrors `sakurasato-init` build context).
      context: ..
      dockerfile: tests/federation/Dockerfile.tmux
    image: sakurasato/federation-pytest-tmux:dev
    command: ["pytest", "-xvs", "--tb=short", "test_nekonoverse_tui.py"]
    environment:
      SAKURASATO_BASE_URL: https://sakurasato
      SAKURASATO_DOMAIN: sakurasato
      SAKURASATO_LOCAL_API_SOCKET: /home/nonroot/local.sock
      SAKURASATO_TOKEN_FILE: /home/nonroot/pytest.token
      NEKONOVERSE_BASE_URL: https://nekonoverse
      NEKONOVERSE_DOMAIN: nekonoverse
      NEKONOVERSE_USERNAME: bob
      # Mastodon stack を立てていないので autouse wait を OFF にする。
      MASTODON_ENABLED: "0"
      NEKONOVERSE_ENABLED: "1"
      SSL_CERT_FILE: /certs/ca.crt
      REQUESTS_CA_BUNDLE: /certs/ca.crt
      # tmux に与える window サイズはコンテナ TERM の影響を受けないよう
      # lib.sh 内で `-x 200 -y 50` 固定。env 上書きの余地は残しておく。
      TERM: xterm-256color
    user: "65532:65532"
    depends_on:
      sakurasato-server:
        condition: service_started
      sakurasato-token-issuer:
        condition: service_completed_successfully
      nekonoverse-bob-issuer:
        condition: service_completed_successfully
      nekonoverse-worker:
        condition: service_started
      nginx-neko:
        condition: service_started
      nginx-sks:
        condition: service_started
    volumes:
      - certs:/certs:ro
      - sakurasato_local_api:/home/nonroot:ro
    networks:
      - nekonoverse-fed
    profiles: [pytest]
    restart: "no"

volumes:
  certs:
  media_sock:
  # sakurasato local API UDS + token を pytest と共有する。Mastodon stack と
  # 名前を揃えてあるので、CI から見たときに同じ意味合いで覗ける。
  sakurasato_local_api:

networks:
  nekonoverse-fed:
    driver: bridge
